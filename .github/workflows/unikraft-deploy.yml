name: Unikraft Cloud Deploy

# Builds the fork into a unikernel image and deploys/updates it on
# Unikraft Cloud (https://unikraft.cloud).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UKC_TOKEN            Unikraft Cloud API token (console.unikraft.cloud)
#   MANAGEMENT_PASSWORD  Password for the CLIProxyAPI management panel
#
# Optional repository variables (same settings page, "Variables" tab):
#   UKC_METRO   Metro to deploy in (default: sfo)
#   UKC_ORG     Unikraft Cloud organization used as the image namespace
#               (default: nero; repository variables, NOT environment variables)
#   UKC_DOMAIN  Optional custom subdomain prefix for the public FQDN, e.g.
#               "cliproxy" yields cliproxy.sfo.unikraft.app. Applies on
#               instance (re)creation only - run the workflow manually with
#               "recreate_instance" checked to switch an existing deployment.
#
# Manual run: checking the "recreate_instance" input deletes and recreates
# the instance (required to apply create-only fields such as the service
# domain). Regular pushes update the existing instance in place.

on:
  push:
    branches: [main]
    paths:
      - "Kraftfile"
      - "Dockerfile.unikraft"
      - "unikraft-entrypoint.sh"
      - ".github/workflows/unikraft-deploy.yml"
      - "cmd/**"
      - "internal/**"
      - "sdk/**"
      - "config.example.yaml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      recreate_instance:
        description: 'Delete and recreate the instance (required to apply create-only fields such as the service domain or metro)'
        type: boolean
        default: false

concurrency:
  group: unikraft-deploy
  cancel-in-progress: false

env:
  UKC_METRO: ${{ vars.UKC_METRO || 'sfo' }}
  UKC_ORG: ${{ vars.UKC_ORG || 'nero' }}
  UKC_DOMAIN: ${{ vars.UKC_DOMAIN || '' }}
  INSTANCE_NAME: cliproxyapi
  IMAGE_NAME: cliproxyapi
  VOLUME_NAME: cliproxyapi-data
  VOLUME_SIZE_MB: "512"
  MEMORY_MB: "512"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          MANAGEMENT_PASSWORD: ${{ secrets.MANAGEMENT_PASSWORD }}
        run: |
          if [ -z "$UKC_TOKEN" ]; then
            echo "::error::Missing repository secret UKC_TOKEN. Create an API token at https://console.unikraft.cloud and add it as a secret named UKC_TOKEN."
            exit 1
          fi
          if [ -z "$MANAGEMENT_PASSWORD" ]; then
            echo "::error::Missing repository secret MANAGEMENT_PASSWORD. Choose a strong password for the CLIProxyAPI management panel and add it as a secret named MANAGEMENT_PASSWORD."
            exit 1
          fi

      - name: Install Unikraft CLI and login
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.UKC_TOKEN }}
          organization: ${{ vars.UKC_ORG }}

      - name: Resolve image reference
        run: |
          set -euo pipefail
          # OCI repository paths must be lowercase; an uppercase first
          # component would be parsed as a registry hostname.
          org="$(printf '%s' "$UKC_ORG" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REF=${org}/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"
          echo "Image reference: ${org}/${IMAGE_NAME}:latest"

      - name: Build image
        run: |
          set -euo pipefail
          # The root Kraftfile points `rootfs.source` at Dockerfile.unikraft,
          # so the fork's original Dockerfile stays untouched.
          unikraft build . \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$IMAGE_REF"

      - name: Ensure persistent volume
        run: |
          set -euo pipefail
          if unikraft volumes get "$VOLUME_NAME" -o quiet >/dev/null 2>&1; then
            echo "Volume $VOLUME_NAME already exists"
          else
            unikraft volumes create --name "$VOLUME_NAME" --metro "$UKC_METRO" --size "$VOLUME_SIZE_MB" \
              || unikraft volumes get "$VOLUME_NAME" -o quiet
            echo "Volume $VOLUME_NAME created"
          fi

      - name: Deploy instance
        env:
          MANAGEMENT_PASSWORD: ${{ secrets.MANAGEMENT_PASSWORD }}
          RECREATE: ${{ inputs.recreate_instance == true }}
        run: |
          set -euo pipefail

          instance_exists=false
          if unikraft instances get "$INSTANCE_NAME" -o quiet >/dev/null 2>&1; then
            instance_exists=true
          fi

          do_create=false
          if [ "$instance_exists" = false ]; then
            echo "Instance $INSTANCE_NAME not found, will create"
            do_create=true
          elif [ "$RECREATE" = "true" ]; then
            echo "Recreate requested, replacing instance $INSTANCE_NAME"
            # Capture the old service group so it can be cleaned up; its
            # random FQDN disappears with it. Output may be an object or a
            # one-element array depending on CLI version.
            old_svc="$(unikraft instances get "$INSTANCE_NAME" -o json 2>/dev/null \
              | jq -r 'if type=="array" then (.[0] // {}) else . end | (.service.name // "")' \
              || true)"
            unikraft instances delete "$INSTANCE_NAME"
            if [ -n "$old_svc" ]; then
              unikraft services delete "$old_svc" || true
            fi
            # Give the volume time to detach before reattaching it to the
            # new instance.
            for _ in $(seq 1 30); do
              unikraft volumes get "$VOLUME_NAME" 2>/dev/null | grep -qw available && break
              sleep 2
            done
            do_create=true
          fi

          if [ "$do_create" != "true" ]; then
            echo "Instance $INSTANCE_NAME exists, updating in place"
            unikraft instances edit "$INSTANCE_NAME" \
              --image "$IMAGE_REF" \
              --scale-to-zero "policy=off" \
              -e "DEPLOY=cloud" \
              -e "MANAGEMENT_PASSWORD=${MANAGEMENT_PASSWORD}" \
              -e "WRITABLE_PATH=/data"
            # Ensure the new image is running; tolerate an in-flight restart.
            unikraft instances restart "$INSTANCE_NAME" || true
          else
            echo "Creating instance $INSTANCE_NAME"
            domain_args=()
            if [ -n "$UKC_DOMAIN" ]; then
              domain_args+=(--domain "$UKC_DOMAIN")
            fi
            unikraft instances create \
              --name "$INSTANCE_NAME" \
              --metro "$UKC_METRO" \
              --image "$IMAGE_REF" \
              "${domain_args[@]}" \
              -p "443:8317/http+tls" \
              -e "DEPLOY=cloud" \
              -e "MANAGEMENT_PASSWORD=${MANAGEMENT_PASSWORD}" \
              -e "WRITABLE_PATH=/data" \
              -v "${VOLUME_NAME}:/data" \
              -m "$MEMORY_MB" \
              --scale-to-zero "policy=off" \
              --restart=on-failure \
              --autostart
          fi

      - name: Deployment info
        run: |
          set -euo pipefail
          sleep 5
          {
            echo "## Unikraft Cloud deployment"
            echo ""
            echo "Metro: ${UKC_METRO}, instance: ${INSTANCE_NAME}, image: ${IMAGE_REF}"
            echo ""
            echo '```'
            unikraft instances get "$INSTANCE_NAME" -o yaml || true
            echo '```'
            echo ""
            echo "The public HTTPS endpoint (port 443, TLS terminated by Unikraft Cloud) forwards to the instance on port 8317."
            echo "Management panel: https://<fqdn>/management.html - sign in with the secret \`MANAGEMENT_PASSWORD\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recent instance logs
        run: |
          sleep 10
          timeout 30 unikraft instances logs "$INSTANCE_NAME" 2>&1 | tail -n 100 || true
